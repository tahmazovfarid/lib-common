plugins {
    id 'checkstyle'
    id 'java'
    id 'maven-publish'
    id 'java-library'
    id 'org.springframework.boot' version "${springBootVersion}" apply false
}

group = 'az.ailab'
version = properties.projectVersion
tasks.named('compileJava') { options.encoding = 'UTF-8' }
tasks.named('compileTestJava') { options.encoding = 'UTF-8' }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }

    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
    withJavadocJar()
    withSourcesJar()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // BOM - native Gradle platform support (replaces io.spring.dependency-management plugin)
    api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    api platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")
    annotationProcessor platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

    api "io.micrometer:micrometer-tracing"
    api "io.micrometer:micrometer-tracing-bridge-brave"

    api "net.ttddyy:datasource-proxy:${dataSourceProxyVersion}"

    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    api "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-web"
    api "org.springframework:spring-aop"
    api "org.aspectj:aspectjweaver"
    api "org.springframework.boot:spring-boot-starter-validation"
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    api "org.mapstruct:mapstruct:${mapStructVersion}"

    api "org.springframework.cloud:spring-cloud-starter-openfeign"

    api "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"
    api "io.swagger.core.v3:swagger-core-jakarta:${swaggerVersion}"
    api "io.swagger.core.v3:swagger-models-jakarta:${swaggerVersion}"

    api "io.github.openfeign:feign-annotation-error-decoder:${openFeignVersion}"
    api "io.github.openfeign:feign-jackson"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapStructBindingVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapStructVersion}"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

// Enable the jar task
jar {
    enabled = true
}

test {
    useJUnitPlatform()
}

wrapper {
    gradleVersion = properties.gradleVersion
}

checkstyle {
    toolVersion = checkStyleVersion
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}